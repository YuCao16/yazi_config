[mgr]
ratio = [1, 2, 3]
linemode = "size_and_mtime"

[preview]
max_width = 30000
# max_height = 3000

[plugin]
prepend_previewers = [
	# Archive previewer
	{ mime = "application/*zip",            run = "ouch" },
	{ mime = "application/x-tar",           run = "ouch" },
	{ mime = "application/x-bzip2",         run = "ouch" },
	{ mime = "application/x-7z-compressed", run = "ouch" },
	{ mime = "application/x-rar",           run = "ouch" },
	{ mime = "application/x-xz",            run = "ouch" },
]

# git.yazi: show git status as linemode
[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# mime-ext.yazi: faster mime detection via extension database
[[plugin.prepend_fetchers]]
id    = "mime"
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
id    = "mime"
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"
